<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAZARO Admin</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2f2f2;
}

header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}

.box{
  max-width:500px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:12px;
}

input{
  width:100%;
  padding:14px;
  box-sizing:border-box;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#f59e0b;
  font-weight:bold;
  cursor:pointer;
}

#panel{
  display:none;
}

.elan{
  background:#f3f4f6;
  padding:15px;
  margin-top:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>BAZARO</h1>
<p>Admin Paneli</p>
</header>

<div class="box" id="giris">

<h2>Admin girişi</h2>

<input
type="password"
id="sifre"
placeholder="Şifrəni yazın">

<button onclick="daxilOl()">
Daxil ol
</button>

<p id="mesaj"></p>

</div>


<div class="box" id="panel">

<h2>✅ Admin panelinə xoş gəlmisiniz</h2>

<p>Buradan BAZARO saytını idarə edə bilərsiniz.</p>

<div class="elan">
<h3>Elanların idarəsi</h3>
<p>Hazırda elan yoxdur.</p>
</div>

<button onclick="cixis()">
Çıxış
</button>

</div>


<script>

function daxilOl(){

var sifre =
document.getElementById("sifre").value;

if(sifre === "12345"){

document.getElementById("giris").style.display="none";

document.getElementById("panel").style.display="block";

}else{

document.getElementById("mesaj").innerText=
"❌ Şifrə yanlışdır.";

}

}

function cixis(){

document.getElementById("panel").style.display="none";

document.getElementById("giris").style.display="block";

document.getElementById("sifre").value="";

}

</script>

</body>
</html>
