<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAZARO Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
}

header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}

.box{
  max-width:500px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-sizing:border-box;
}

input{
  width:100%;
  padding:14px;
  box-sizing:border-box;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#f59e0b;
  color:#111;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

#panel{
  display:none;
}

#elanForm{
  display:none;
  margin-top:20px;
}

.elan{
  background:#f3f4f6;
  padding:15px;
  margin-top:15px;
  border-radius:8px;
}

.elan img{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:8px;
  margin-top:10px;
}

.sil{
  background:#dc2626;
  color:white;
}

.basari{
  color:green;
  font-weight:bold;
}

.xeta{
  color:red;
  font-weight:bold;
}

#elanlar{
  margin-top:20px;
}
</style>
</head>

<body>

<header>
<h1>BAZARO</h1>
<p>Admin Paneli</p>
</header>


<!-- GİRİŞ -->

<div class="box" id="giris">

<h2>Admin girişi</h2>

<input
type="password"
id="sifre"
placeholder="Şifrəni yazın">

<button onclick="daxilOl()">
Daxil ol
</button>

<p id="mesaj"></p>

</div>


<!-- ADMİN PANELİ -->

<div class="box" id="panel">

<h2>✅ Admin panelinə xoş gəlmisiniz</h2>

<p>Buradan BAZARO saytını idarə edə bilərsiniz.</p>

<button onclick="formuGoster()">
➕ Elan əlavə et
</button>


<!-- ELAN ƏLAVƏ ET FORMU -->

<div id="elanForm">

<h2>Yeni elan əlavə et</h2>

<input
type="text"
id="elanAdi"
placeholder="Elanın adı">

<input
type="number"
id="elanQiymet"
placeholder="Qiymət (manat)">

<input
type="text"
id="elanSeher"
placeholder="Şəhər">

<input
type="text"
id="elanSekil"
placeholder="Şəklin linki">

<button onclick="elanElaveEt()">
Elanı yadda saxla
</button>

<p id="elanMesaj"></p>

</div>


<!-- ELANLAR -->

<div class="elan">

<h3>Elanların idarəsi</h3>

<div id="elanlar">
<p>Hazırda elan yoxdur.</p>
</div>

</div>


<button onclick="cixis()">
Çıxış
</button>

</div>


<script>

function daxilOl(){

var sifre = document.getElementById("sifre").value;

if(sifre === "1
Bz24!Admin#7Qx9){

document.getElementById("giris").style.display="none";

document.getElementById("panel").style.display="block";

document.getElementById("mesaj").innerText="";

elanlariGoster();

}else{

document.getElementById("mesaj").innerText=
"❌ Şifrə yanlışdır.";

document.getElementById("mesaj").className="xeta";

}

}


function formuGoster(){

document.getElementById("elanForm").style.display="block";

}


function elanElaveEt(){

var ad =
document.getElementById("elanAdi").value.trim();

var qiymet =
document.getElementById("elanQiymet").value.trim();

var seher =
document.getElementById("elanSeher").value.trim();

var sekil =
document.getElementById("elanSekil").value.trim();


if(ad === "" || qiymet === "" || seher === ""){

document.getElementById("elanMesaj").innerText=
"❌ Elanın adı, qiyməti və şəhəri yazılmalıdır.";

document.getElementById("elanMesaj").className="xeta";

return;

}


var elanlar =
JSON.parse(localStorage.getItem("bazaroElanlar")) || [];


var yeniElan = {

ad: ad,

qiymet: qiymet,

seher: seher,

sekil: sekil

};


elanlar.push(yeniElan);


localStorage.setItem(
"bazaroElanlar",
JSON.stringify(elanlar)
);


document.getElementById("elanMesaj").innerText=
"✅ Elan uğurla əlavə edildi.";

document.getElementById("elanMesaj").className="basari";


document.getElementById("elanAdi").value="";
document.getElementById("elanQiymet").value="";
document.getElementById("elanSeher").value="";
document.getElementById("elanSekil").value="";


elanlariGoster();

}


function elanlariGoster(){

var elanlar =
JSON.parse(localStorage.getItem("bazaroElanlar")) || [];

var yer =
document.getElementById("elanlar");


if(elanlar.length === 0){

yer.innerHTML="<p>Hazırda elan yoxdur.</p>";

return;

}


yer.innerHTML="";


elanlar.forEach(function(elan,index){

var div =
document.createElement("div");

div.className="elan";


var html="";

html += "<h3>" + elan.ad + "</h3>";

html += "<p><b>Qiymət:</b> " +
elan.qiymet + " manat</p>";

html += "<p><b>Şəhər:</b> " +
elan.seher + "</p>";


if(elan.sekil !== ""){

html += "<img src='" +
elan.sekil +
"' alt='Elan şəkli'>";

}


html += "<button class='sil' onclick='elanSil(" +
index +
")'>🗑 Elanı sil</button>";


div.innerHTML=html;

yer.appendChild(div);

});

}


function elanSil(index){

var elanlar =
JSON.parse(localStorage.getItem("bazaroElanlar")) || [];


elanlar.splice(index,1);


localStorage.setItem(
"bazaroElanlar",
JSON.stringify(elanlar)
);


elanlariGoster();

}


function cixis(){

document.getElementById("panel").style.display="none";

document.getElementById("giris").style.display="block";

document.getElementById("sifre").value="";

document.getElementById("mesaj").innerText="";

}

</script>

</body>
</html>
