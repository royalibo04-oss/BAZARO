<!DOCTYPE html>
<html lang="az">
<head>

.delete{

.hidden{

.ad{

</style>

<input type="password" id="password" placeholder="Admin şifrəsi">

<button class="login" onclick="login()">Daxil ol</button>

<p id="error"></p>
</div>
