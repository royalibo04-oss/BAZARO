<!DOCTYPE html>
<html lang="az">
<head><meta name="google-site-verification" content="Kws9ycHwSosAP4njDkGC2QVKU6gi0NhsGX78e0klDtU" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAZARO — Al, sat, tap</title>

<meta name="description"
content="BAZARO — Azərbaycanda alqı-satqı elanları.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fa;
color:#111827;
}

header{
background:#111827;
color:white;
padding:18px 20px;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:900;
}

.logo span{
color:#f59e0b;
}

.admin{
background:#f59e0b;
color:#111827;
padding:11px 17px;
border-radius:9px;
text-decoration:none;
font-weight:bold;
}

.hero{
background:linear-gradient(135deg,#111827,#374151);
color:white;
padding:60px 20px;
}

.hero-inner{
max-width:1100px;
margin:auto;
}

.hero h1{
font-size:42px;
margin:0 0 12px;
}

.hero p{
font-size:18px;
color:#d1d5db;
}

.search{
margin-top:25px;
background:white;
padding:10px;
border-radius:14px;
display:flex;
max-width:850px;
}

.search input{
flex:1;
border:0;
outline:0;
padding:15px;
font-size:16px;
}

.search button{
background:#f59e0b;
border:0;
padding:0 25px;
border-radius:10px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:35px auto;
padding:0 20px;
}

.categories{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
}

.category{
background:white;
padding:22px;
border-radius:14px;
text-align:center;
cursor:pointer;
border:1px solid #e5e7eb;
}

.icon{
font-size:32px;
}

.ads{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-top:20px;
}

.ad{
background:white;
border-radius:15px;
overflow:hidden;
border:1px solid #e5e7eb;
}

.ad-image{
height:190px;
background:#e5e7eb;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
}

.ad-image img{
width:100%;
height:100%;
object-fit:cover;
}

.ad-body{
padding:17px;
}

.title{
font-size:18px;
font-weight:bold;
}

.price{
font-size:21px;
font-weight:900;
color:#d97706;
margin-top:8px;
}

.location{
color:#6b7280;
margin-top:7px;
}

.empty{
background:white;
padding:45px;
text-align:center;
border-radius:14px;
grid-column:1/-1;
}

footer{
margin-top:50px;
background:#111827;
color:#9ca3af;
padding:30px;
text-align:center;
}

@media(max-width:800px){

.categories{
grid-template-columns:repeat(2,1fr);
}

.ads{
grid-template-columns:repeat(2,1fr);
}

.hero h1{
font-size:32px;
}

}

@media(max-width:550px){

.header{
flex-direction:column;
gap:15px;
}

.search{
flex-direction:column;
}

.search button{
padding:14px;
}

.ads{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
BAZARO<span>.</span>
</div>

<a href="admin.html" class="admin">
➕ Elan yerləşdir
</a>

</div>

</header>


<section class="hero">

<div class="hero-inner">

<h1>İstədiyini tap.</h1>

<p>
Al, sat və ən yaxşı elanları bir yerdə kəşf et.
</p>

<div class="search">

<input
id="axtaris"
type="text"
placeholder="Nə axtarırsınız?"
oninput="elanlariGoster()">

<button onclick="elanlariGoster()">
Axtar
</button>

</div>

</div>

</section>


<div class="container">

<h2>Kateqoriyalar</h2>

<div class="categories">

<div class="category" onclick="axtar('Avtomobil')">
<div class="icon">🚗</div>
Avtomobil
</div>

<div class="category" onclick="axtar('Ev')">
<div class="icon">🏠</div>
Ev
</div>

<div class="category" onclick="axtar('Telefon')">
<div class="icon">📱</div>
Telefon
</div>

<div class="category" onclick="axtar('Elektronika')">
<div class="icon">💻</div>
Elektronika
</div>

</div>


<h2 style="margin-top:45px">
Son elanlar
</h2>

<div id="elanlar" class="ads">

<div class="empty">
Elanlar yüklənir...
</div>

</div>

</div>


<footer>

<strong>BAZARO</strong>

<br><br>

Al • Sat • Tap

<br><br>

© 2026 BAZARO

</footer>


<script>

const SUPABASE_URL =
"https://gjezgknucxrdwgpguvvc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0vHSpquc5eJYd4rnlYHCaQ_zz-BaSdX";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let butunElanlar = [];


async function elanlariYukle(){

const { data, error } =
await supabaseClient
.from("elanlar")
.select("*")
.order("id", { ascending:false });


if(error){

console.error(error);

document.getElementById("elanlar").innerHTML = `
<div class="empty">
Elanları yükləmək mümkün olmadı.
</div>
`;

return;

}


butunElanlar = data || [];

elanlariGoster();

}


function axtar(metn){

document.getElementById("axtaris").value = metn;

elanlariGoster();

window.scrollTo({
top:650,
behavior:"smooth"
});

}


function elanlariGoster(){

const axtaris =
document.getElementById("axtaris")
.value
.toLowerCase()
.trim();


const netice =
butunElanlar.filter(function(elan){

const metn =
(
elan.ad || ""
).toLowerCase();

return (
axtaris === "" ||
metn.includes(axtaris)
);

});


const yer =
document.getElementById("elanlar");


if(netice.length === 0){

yer.innerHTML = `
<div class="empty">

<div style="font-size:45px">
🔍
</div>

<h3>Elan tapılmadı</h3>

<p>
Hazırda uyğun elan yoxdur.
</p>

</div>
`;

return;

}


yer.innerHTML = "";


netice.forEach(function(elan){

const kart =
document.createElement("div");

kart.className = "ad";


let sekil = "";

if(elan.sekil){

sekil = `
<div class="ad-image">
<img
src="${elan.sekil}"
alt="${elan.ad || "BAZARO elanı"}"
>
</div>
`;

}else{

sekil = `
<div class="ad-image">
📦
</div>
`;

}


kart.innerHTML = `

${sekil}

<div class="ad-body">

<div class="title">
${elan.ad || "Adsız elan"}
</div>

<div class="price">
${elan.qiymet || 0} AZN
</div>

<div class="location">
📍 ${elan.seher || "Azərbaycan"}
</div>

</div>

`;


yer.appendChild(kart);

});

}


elanlariYukle();

</script>

</body>
</html>
